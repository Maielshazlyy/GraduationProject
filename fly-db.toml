app = "digital-employee-db"
primary_region = "iad"

[build]
  image = "mcr.microsoft.com/mssql/server:2022-latest"

[env]
  ACCEPT_EULA = "Y"
  MSSQL_PID = "Express"
  MSSQL_MEMORY_LIMIT_MB = "512"

[mounts]
  source = "sqlserver_data"
  destination = "/var/opt/mssql"
  initial_size = "5gb"

[[services]]
  protocol = "tcp"
  internal_port = 1433

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"