# Fly.io configuration for the .NET 10 API
# App name: digital-employee-api
app = "graduationproject"
primary_region = "iad"   # US East — change to closest: ams=Europe, sin=Asia, syd=Australia

[build]
  dockerfile = "Dockerfile"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  ASPNETCORE_URLS        = "http://+:10000"

[http_service]
  internal_port        = 10000
  force_https          = true
  auto_stop_machines   = true    # saves free credits when idle
  auto_start_machines  = true
  min_machines_running = 0

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "512mb"       # .NET API fits in 512 MB
  cpu_kind = "shared"
  cpus = 1
